name: Build and Release

on:
  push:
    tags:
      - "cli/*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GOPRIVATE: "*github.com/fragshq/*"
      GONOSUMDB: "github.com/fragshq/*"
      GOFLAGS: "-mod=mod"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required by GoReleaser to compute tags and changelogs

      - name: Configure Git for private modules
        run: |
          echo "machine github.com login x-access-token password ${{ secrets.TOKEN }}" > ~/.netrc
          chmod 600 ~/.netrc

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Write version file
        working-directory: cli
        run: |
          cat > version.go <<EOF
          package main

          const version = "${GITHUB_REF_NAME}"
          EOF

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --allow-dirty
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}