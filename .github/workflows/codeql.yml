name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '34 20 * * 6'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: go
          build-mode: autobuild

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # =========================================================================
    # CUSTOM GO SETUP FOR PRIVATE MODULES
    # =========================================================================
    - name: Set up Go
      if: matrix.language == 'go'
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'

    - name: Configure Private Go Modules
      if: matrix.language == 'go'
      env:
        GOPRIVATE_TOKEN: ${{ secrets.TOKEN }}
      run: |
        # Use PAT token to authenticate HTTPS calls to GitHub
        git config --global url."https://x-access-token:${GOPRIVATE_TOKEN}@github.com/".insteadOf "https://github.com/"
        
        # Tell Go to bypass proxy.golang.org for your private orgs/users
        go env -w GOPRIVATE="github.com/theirish81/*"

    - name: Pre-fetch Go modules
      if: matrix.language == 'go'
      run: go mod download
    # =========================================================================

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Run manual build steps
      if: matrix.build-mode == 'manual'
      shell: bash
      run: |
        echo 'If you are using a "manual" build mode for one or more of the' \
          'languages you are analyzing, replace this with the commands to build' \
          'your code, for example:'
        echo '  make bootstrap'
        echo '  make release'
        exit 1

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
